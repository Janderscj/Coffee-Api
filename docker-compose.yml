services:
  coffee-api:
    build:
      context: ./backend
    ports:
      - '5000:5000'
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - coffee-mongo-data:/data/db

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    env_file:
      - .env

volumes:
  coffee-mongo-data:
