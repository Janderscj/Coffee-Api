server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

   # Anything under /api goes to the Express container
  location /api/ {
    proxy_pass http://coffee-api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything else is the React app. Unknown paths (like /admin on a page refresh)
  # fall back to index.html so React Router can handle them.
  location / {
    try_files $uri /index.html;
  }
}